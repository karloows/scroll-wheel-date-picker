name: scroll_wheel_date_picker
description: "A Flutter package for a scrollable and flat perspective wheel-type date picker like in TikTok."
version: 0.1.4
homepage: https://github.com/karloows/scroll-wheel-date-picker
repository: https://github.com/karloows/scroll-wheel-date-picker
issue_tracker: https://github.com/karloows/scroll-wheel-date-picker/issues

environment:
  sdk: ">=3.2.5 <4.0.0"
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  intl: ">=0.19.0 <1.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=2.0.0 <7.0.0"

flutter:

topics:
  - ui
  - datepicker
  - widgets
  - scroll
  - wheel

screenshots:
  - description: Flat picker with holo overlay.
    path: demo/flat_holo.gif
